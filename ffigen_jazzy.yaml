name: RcldartBindings
description: Regenerated against ROS 2 Jazzy (/opt/ros/jazzy), incl rcl_action.
output:
  bindings: 'lib/src/gen/rcldart_bindings_generated.dart'
  symbol-file:
    output: 'lib/src/gen/rcldart_bindings_generated_symbols.yaml'
    import-path: 'package:rcldart/src/gen/rcldart_bindings_generated.dart'
llvm-path:
  - '/usr/lib/llvm-18'
structs:
  exclude:
    - 'max_align_t'
    - '_.*'
headers:
  entry-points:
    - '/opt/ros/jazzy/include/rcl/rcl/rcl.h'
    - '/opt/ros/jazzy/include/rcl_action/rcl_action/rcl_action.h'
    - '/opt/ros/jazzy/include/rosidl_runtime_c/rosidl_runtime_c/primitives_sequence.h'
    - '/opt/ros/jazzy/include/rosidl_runtime_c/rosidl_runtime_c/string.h'
comments:
  style: any
  length: full
compiler-opts:
  - '-isystem/usr/lib/gcc/x86_64-linux-gnu/13/include'
  - '-I/opt/ros/jazzy/include/ackermann_msgs'
  - '-I/opt/ros/jazzy/include/ackermann_steering_controller'
