name: rcldart
description: "A new Flutter FFI plugin for ROS2 bindings"
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  logger: ^2.3.0

  plugin_platform_interface: ^2.0.2
  
  
  std_msgs:
    git:
      url: https://github.com/rcldart/std_msgs.git
      # branch: master
      ref: 8765c67 
         
dev_dependencies:
  ffi: ^2.1.0
  ffigen: ^9.0.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      # android:
      #   ffiPlugin: false
      # ios:
      #   ffiPlugin: false
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true

