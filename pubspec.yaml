name: rcldart
description: "A new Flutter FFI plugin for ROS2 bindings"
version: 0.0.1
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  logger: ^2.3.0
  logging: ^1.2.0

  plugin_platform_interface: ^2.0.2

  ffi: ^2.1.0

  # rcldart_utils: core BaseRosMessage / BaseRosService / dynamiclibraryloader,
  # used throughout lib/src. It is a separate package (generated message packages
  # depend on it too) and must be published to pub.dev before rcldart — see
  # PUBLISHING.md. The hosted constraint keeps this pubspec pub.dev-valid; the
  # path override below is DEV-ONLY (ignored by consumers of rcldart).
  rcldart_utils: ^1.0.0

# Local development only: resolve the sibling package from the checkout. Consumers
# of rcldart on pub.dev never see these overrides. (ros_cdr is now vendored into
# lib/src/cdr; std_msgs was unused and removed.)
dependency_overrides:
  rcldart_utils:
    path: ./rcldart_utils

dev_dependencies:
  ffigen: ^9.0.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      # Android: ffiPlugin builds the getifaddrs shim (android/CMakeLists.txt)
      # and the module bundles the cross-compiled ROS 2 closure from
      # android/src/main/jniLibs/<abi>/ into the app APK. See docs/android_support.md.
      android:
        ffiPlugin: true
      # ios:
      #   ffiPlugin: false
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true

  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/assets-and-images/#from-packages
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
